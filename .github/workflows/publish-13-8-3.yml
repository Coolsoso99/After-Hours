name: Publish AFTER HOURS v13.8.3 and deploy iPhone PWA
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-13-8-3.yml']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  release-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout game repository
        uses: actions/checkout@v4

      - name: Create version tag
        run: |
          if ! git ls-remote --exit-code --tags origin refs/tags/v13.8.3 >/dev/null; then
            git tag v13.8.3
            git push origin refs/tags/v13.8.3
          fi

      - name: Verify public release or publish prepared draft
        run: |
          if gh release view v13.8.3 >/dev/null 2>&1; then
            echo "v13.8.3 is already public with its uploaded downloads."
          else
            release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[] | select(.draft and ((.name // "") | contains("v13.8.3"))) | .id' | head -n 1)"
            if [ -z "$release_id" ]; then
              echo "The v13.8.3 draft is missing."
              exit 1
            fi
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
              -f tag_name=v13.8.3 \
              -f target_commitish=main \
              -F draft=false \
              -F prerelease=false
          fi

      - name: Extract iPhone PWA
        run: |
          mkdir -p release-download site
          gh release download v13.8.3 --pattern "After_Hours_13.8.3_iPhone_PWA.zip" --dir release-download
          unzip -q release-download/After_Hours_13.8.3_iPhone_PWA.zip -d site
          test -f site/index.html
          test -f site/manifest.webmanifest
          test -f site/sw.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
