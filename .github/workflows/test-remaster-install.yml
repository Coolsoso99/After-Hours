name: Test remaster APK installation
on:
  push:
    paths: ['.github/workflows/test-remaster-install.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Download published signed APK
        run: |
          curl --fail --location --retry 3 'https://github.com/Coolsoso99/After-Hours/releases/download/remaster-android-test-1/After_Hours_Remaster_12_7_20_Audio_FPS.apk' -o remaster.apk
          echo '2aecb6d1b432159ba51891dd935e3ca7c6d619f287928e089c55a447d98d0845  remaster.apk' | sha256sum -c -
      - name: Enable emulator hardware acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Test Android 16 install and launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            curl --fail --location 'https://github.com/Coolsoso99/After-Hours/releases/download/remaster-android-test-1/After_Hours_Remaster_Android_Test_1.apk' -o previous.apk
            adb install previous.apk
            adb install -r remaster.apk
            adb shell am start -W -n com.afterhours.hav14.remastertest/com.afterhours.hav14.MainActivity
            adb logcat -d -s AndroidRuntime PackageManager
